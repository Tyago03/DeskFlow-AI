name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Pytest (no Ollama credentials required)
        run: python -m pytest -q
